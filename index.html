<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live room</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main id="viewer">
    <header id="room-header">
      <h1 id="room-name"></h1>
    </header>
    <div id="app" aria-label="The recorded room"></div>
    <footer id="room-footer">
      <div id="room-copy">
        <p id="room-activity" aria-live="polite"></p>
        <p id="live-status" role="status" aria-live="polite"></p>
      </div>
      <div id="room-controls" aria-label="Room controls">
        <select id="follow-picker" aria-label="Choose resident" disabled>
          <option value="" selected>Choose resident</option>
        </select>
        <select id="place-picker" aria-label="Choose place" disabled>
          <option value="" selected>Choose place</option>
        </select>
        <button id="pause" type="button" aria-label="Pause" aria-pressed="false">Pause</button>
      </div>
    </footer>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
