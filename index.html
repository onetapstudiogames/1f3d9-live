<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1F3D9 live</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app" aria-label="The recorded city"></div>
  <header id="viewer-ui">
    <div class="panel identity">
      <strong>1F3D9</strong><time id="clock" aria-label="Recorded time in UTC">—</time>
      <div id="view"></div>
    </div>
    <div class="panel controls-panel">
      <div class="controls playback">
        <button id="pause" type="button" aria-label="Pause" title="Pause">⏸</button>
        <button id="normal" type="button" aria-label="Normal speed" title="Normal speed" aria-pressed="true">▶</button>
        <button id="fast" type="button" aria-label="Fast forward" title="Fast forward · 60×" aria-pressed="false"><svg width="18" height="16" viewBox="0 0 18 16" aria-hidden="true"><path fill="currentColor" d="M1 2v12l8-6zm8 0v12l8-6z"/></svg></button>
        <button id="replay-day" type="button" aria-label="Replay the day" title="Replay the day">↶</button>
        <button id="nearby" type="button" title="Focus on current activity">Focus</button>
        <button id="city" type="button" aria-label="Whole city" title="Whole city">⌂</button>
      </div>
      <div class="controls">
        <select id="follow-picker" aria-label="Choose resident"><option value="">Follow a resident…</option></select>
        <button id="follow-stop" type="button" aria-label="Stop following" title="Stop following" hidden>×</button>
        <label class="icon-check" title="Show sleepers"><input id="show-sleepers" type="checkbox" aria-label="Show sleepers"><span aria-hidden="true">Zz</span></label>
        <label class="icon-check" title="Sound"><input id="sound" type="checkbox" aria-label="Sound"><span aria-hidden="true">♫</span></label>
        <button id="minimap-toggle" type="button" aria-label="Show map" title="Show map" aria-expanded="false">▦</button>
      </div>
    </div>
    <aside id="minimap" class="panel" aria-label="City minimap" hidden><canvas id="minimap-canvas" aria-label="Click the minimap to move the city view"></canvas></aside>
  </header>
  <button id="ui-toggle" type="button" aria-label="Hide controls" title="Hide controls" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="none" stroke="currentColor" d="M1.5 2.5h13v11h-13zM1.5 6h13M6 6v7.5"/></svg></button>
  <section id="activity-panel" class="panel" aria-label="Recent activity">
    <div class="activity-toolbar"><button id="activity-toggle" type="button" aria-expanded="true" aria-controls="activity-list">Recent activity</button>
      <select id="activity-filter" aria-label="Activity filter"><option value="all">All</option><option value="chats">Chats</option></select></div>
    <div id="activity-list" role="log" aria-live="polite" aria-relevant="additions"></div>
  </section>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
