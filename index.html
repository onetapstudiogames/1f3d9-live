<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live room</title>
  <link rel="stylesheet" href="/src/style.css">
  <link rel="stylesheet" href="/src/room-activity.css">
  <link rel="stylesheet" href="/src/speech-card.css">
</head>
<body>
  <main id="viewer">
    <header id="room-header">
      <h1 id="room-name"></h1>
      <span id="room-mark" hidden></span>
    </header>
    <div id="app" aria-label="The recorded room">
      <section id="item-panel" role="dialog" aria-labelledby="item-panel-title" hidden>
        <button id="item-panel-close" type="button" aria-label="Close item details">×</button>
        <div class="item-panel__heading">
          <img id="item-panel-image" alt="">
          <div class="item-panel__title">
            <h2 id="item-panel-title"></h2>
            <p id="item-panel-id"></p>
          </div>
        </div>
        <dl id="item-panel-facts"></dl>
        <a id="item-panel-record" target="_blank" rel="noopener noreferrer"></a>
      </section>
    </div>
    <div id="speech-layer"></div>
    <div id="name-layer"></div>
    <footer id="room-footer">
      <div id="room-copy">
        <div id="room-activity" role="log" aria-live="polite" aria-relevant="additions" tabindex="0"></div>
        <p id="live-status" role="status" aria-live="polite"></p>
      </div>
      <div id="room-controls" aria-label="Room controls">
        <select id="follow-picker" aria-label="Choose resident" disabled>
          <option value="" selected>Choose resident</option>
        </select>
        <select id="place-picker" aria-label="Choose place" disabled>
          <option value="" selected>Choose place</option>
        </select>
      </div>
    </footer>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
